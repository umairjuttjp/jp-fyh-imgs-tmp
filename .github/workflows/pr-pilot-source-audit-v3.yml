name: Observable PR pilot — source audit v3

on:
  pull_request:
    branches: [master]
    paths:
      - 'catalog-audit/pr-pilot-trigger.txt'
      - 'catalog-audit/source_audit_engine_v3.py'
      - '.github/workflows/pr-pilot-source-audit-v3.yml'

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python3 -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Compile engine
        run: python3 -m py_compile catalog-audit/source_audit_engine_v3.py
      - name: Run first 12 products
        run: |
          rm -rf source-audit-pilot-v3
          mkdir -p source-audit-pilot-v3
          python3 catalog-audit/source_audit_engine_v3.py \
            --input catalog-audit/chunks/products_0001_0100.json \
            --output source-audit-pilot-v3/pilot_first_12.json \
            --limit 12 --delay 0.05 \
            > source-audit-pilot-v3/run_stdout.log \
            2> source-audit-pilot-v3/run_stderr.log
      - name: Build summary
        if: always()
        run: |
          python3 - <<'PY'
          import collections, json, pathlib
          base=pathlib.Path('source-audit-pilot-v3')
          path=base/'pilot_first_12.json'
          try:
              rows=json.loads(path.read_text(encoding='utf-8')) if path.exists() else []
          except Exception:
              rows=[]
          def read(name):
              p=base/name
              return p.read_text(encoding='utf-8',errors='replace')[-30000:] if p.exists() else ''
          summary={
              'count':len(rows),
              'status_counts':dict(collections.Counter(r.get('final_status') for r in rows)),
              'verified_count':sum(1 for r in rows if str(r.get('final_status','')).startswith('VERIFIED_')),
              'stdout_tail':read('run_stdout.log'),
              'stderr_tail':read('run_stderr.log'),
              'rows':[{k:r.get(k) for k in [
                  'shopify_product_id','store_title','vendor','official_domains','public_model_codes',
                  'localized_identity_clues','final_status','final_source_url','source_type','confidence',
                  'best_candidate_url','best_candidate_status','best_candidate_score',
                  'verification_evidence','matched_model_codes','matched_jans','matched_size_count',
                  'elapsed_seconds','engine_version'
              ]} for r in rows]
          }
          (base/'pilot_summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
      - name: Upload pilot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-audit-pilot-v3
          path: source-audit-pilot-v3/
          if-no-files-found: error
          retention-days: 7
